[workspace]
resolver = "2"
members = [
    "crates/tshark-core",
    "crates/tshark-capture",
    "crates/tshark-dissect",
    "crates/tshark-filter",
    "crates/tshark-cli",
    "crates/tshark-tui",
]

[workspace.dependencies]
bytes = "1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
